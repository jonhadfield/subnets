name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Install via Go module proxy rather than GitHub release assets, which
      # have been returning intermittent 504s for goreleaser/goreleaser.
      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.18.0

      - name: Release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

  # A signed, notarized and STAPLED installer. The tarballs cannot carry a
  # notarization ticket: a ticket cannot be stapled into a bare Mach-O
  # executable, so Gatekeeper has no offline proof and rejects a directly
  # downloaded binary even though Apple notarized it. A .pkg can be stapled,
  # and files it installs are never quarantined, so the installed binary runs
  # with no Gatekeeper check at all.
  #
  # Needs a macOS runner: pkgbuild and stapler are macOS-only. Free for public
  # repositories. Skips itself when the installer certificate is absent, so the
  # rest of the release is unaffected until the secrets are set.
  #
  # To rebuild the package for an existing tag without re-running goreleaser:
  #   gh workflow run macos-installer.yml -f tag=v0.1.3
  installer:
    name: macOS installer package
    needs: goreleaser
    uses: ./.github/workflows/macos-installer.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
