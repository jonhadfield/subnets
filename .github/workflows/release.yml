name: release

on:
  push:
    tags: ["v*"]
  # Rebuild/upload subnets_macos.pkg for an existing tag without re-running
  # goreleaser (which fails when release assets already exist).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach subnets_macos.pkg to (e.g. v0.1.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Install via Go module proxy rather than GitHub release assets, which
      # have been returning intermittent 504s for goreleaser/goreleaser.
      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.18.0

      - name: Release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

  # A signed, notarized and STAPLED installer. The tarballs cannot carry a
  # notarization ticket: a ticket cannot be stapled into a bare Mach-O
  # executable, so Gatekeeper has no offline proof and rejects a directly
  # downloaded binary even though Apple notarized it. A .pkg can be stapled,
  # and files it installs are never quarantined, so the installed binary runs
  # with no Gatekeeper check at all.
  #
  # Needs a macOS runner: pkgbuild and stapler are macOS-only. Free for public
  # repositories. Skips itself when the installer certificate is absent, so the
  # rest of the release is unaffected until the secrets are set.
  #
  # On tag push it waits for goreleaser. On workflow_dispatch it runs alone
  # against an existing release's darwin archives:
  #   gh workflow run release.yml -f tag=v0.1.3
  installer:
    name: macOS installer package
    needs: [goreleaser]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.goreleaser.result == 'success')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Build, sign, notarize and staple the installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail

          case "$TAG" in
            v*) ;;
            *)
              echo "::error::tag must look like v0.1.3, got: $TAG"
              exit 1
              ;;
          esac

          missing=""
          [ -n "$MACOS_INSTALLER_P12" ] || missing="${missing} MACOS_INSTALLER_P12"
          [ -n "$MACOS_INSTALLER_PASSWORD" ] || missing="${missing} MACOS_INSTALLER_PASSWORD"
          [ -n "$MACOS_NOTARY_KEY" ] || missing="${missing} MACOS_NOTARY_KEY"
          [ -n "$MACOS_NOTARY_KEY_ID" ] || missing="${missing} MACOS_NOTARY_KEY_ID"
          [ -n "$MACOS_NOTARY_ISSUER_ID" ] || missing="${missing} MACOS_NOTARY_ISSUER_ID"
          if [ -n "$missing" ]; then
            msg="Skipping macOS installer package; unset secrets:${missing}"
            echo "::notice::$msg"
            {
              echo "## macOS installer package"
              echo ""
              echo "Skipped. Set these repository secrets (Developer ID **Installer** is a"
              echo "different certificate from Developer ID Application), then either cut"
              echo "the next tag or attach a package to an existing release:"
              echo ""
              echo "\`\`\`"
              echo "gh workflow run release.yml -f tag=$TAG"
              echo "\`\`\`"
              echo ""
              echo "| secret | purpose |"
              echo "| --- | --- |"
              echo "| \`MACOS_INSTALLER_P12\` | base64-encoded Developer ID Installer .p12 |"
              echo "| \`MACOS_INSTALLER_PASSWORD\` | password for that .p12 |"
              echo "| \`MACOS_NOTARY_*\` | same notary key used to notarize the binaries |"
              echo ""
              echo "Missing right now:\`${missing}\`"
              echo ""
              echo "Local helper (run in Terminal.app so Keychain can prompt Allow):"
              echo "\`\`\`"
              echo "./scripts/set-macos-installer-secrets.sh"
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          VERSION="${TAG#v}"
          WORK="$RUNNER_TEMP/pkg"
          mkdir -p "$WORK/payload/usr/local/bin"

          # Reuse the binaries goreleaser already signed and notarized, rather
          # than rebuilding unsigned ones. lipo joins them into one universal
          # binary so a single package covers both architectures.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'subnets_darwin_*.tar.gz' --dir "$WORK"
          tar xzf "$WORK/subnets_darwin_arm64.tar.gz" -C "$WORK" subnets
          mv "$WORK/subnets" "$WORK/subnets.arm64"
          tar xzf "$WORK/subnets_darwin_amd64.tar.gz" -C "$WORK" subnets
          mv "$WORK/subnets" "$WORK/subnets.amd64"
          lipo -create "$WORK/subnets.arm64" "$WORK/subnets.amd64" -output "$WORK/payload/usr/local/bin/subnets"
          chmod 755 "$WORK/payload/usr/local/bin/subnets"

          KEYCHAIN="$RUNNER_TEMP/installer.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          printf %s "$MACOS_INSTALLER_P12" | base64 -d > "$WORK/installer.p12"
          security import "$WORK/installer.p12" -k "$KEYCHAIN" -P "$MACOS_INSTALLER_PASSWORD" -T /usr/bin/pkgbuild -T /usr/bin/productbuild -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          rm -f "$WORK/installer.p12"

          INSTALLER_ID="$(security find-identity -v -p basic "$KEYCHAIN" | grep 'Developer ID Installer' | head -1 | sed 's/.*"\(.*\)"/\1/')"
          if [ -z "$INSTALLER_ID" ]; then
            echo "::error::No 'Developer ID Installer' identity in MACOS_INSTALLER_P12. That is a different certificate type from 'Developer ID Application'."
            exit 1
          fi
          echo "Signing with: $INSTALLER_ID"

          pkgbuild --root "$WORK/payload" --install-location / --identifier uk.co.lessknown.subnets --version "$VERSION" --sign "$INSTALLER_ID" "$WORK/subnets.pkg"

          printf %s "$MACOS_NOTARY_KEY" | base64 -d > "$WORK/notary.p8"
          xcrun notarytool submit "$WORK/subnets.pkg" --key "$WORK/notary.p8" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait --timeout 20m
          rm -f "$WORK/notary.p8"

          xcrun stapler staple "$WORK/subnets.pkg"

          # Prove the ticket is attached and Gatekeeper accepts it. Unlike the
          # bare binaries, this must pass offline.
          xcrun stapler validate "$WORK/subnets.pkg"
          spctl -a -vvv -t install "$WORK/subnets.pkg"

          PKG="$WORK/subnets_macos.pkg"
          mv "$WORK/subnets.pkg" "$PKG"
          gh release upload "$TAG" "$PKG" --repo "$GITHUB_REPOSITORY" --clobber

          # Verify what GitHub actually serves, not just what we built. The
          # checks above ran on a local file; these run on a fresh download, so
          # a truncated or mangled upload cannot ship looking healthy.
          VERIFY="$WORK/verify"
          mkdir -p "$VERIFY"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.pkg' --dir "$VERIFY" --clobber

          BUILT_SHA="$(shasum -a 256 "$PKG" | awk '{print $1}')"
          PUBLISHED_SHA="$(shasum -a 256 "$VERIFY/subnets_macos.pkg" | awk '{print $1}')"
          if [ "$BUILT_SHA" != "$PUBLISHED_SHA" ]; then
            echo "::error::Published installer differs from the one built and stapled here. built=$BUILT_SHA published=$PUBLISHED_SHA"
            exit 1
          fi
          echo "Published sha256 matches the stapled build: $PUBLISHED_SHA"

          xcrun stapler validate "$VERIFY/subnets_macos.pkg"
          spctl -a -vvv -t install "$VERIFY/subnets_macos.pkg"
          echo "Published installer verified: ticket stapled and accepted by Gatekeeper."
